stereo_reconstruction:
  ros__parameters:
    # Calibration and odometry frames are loaded from the same MSCKF parameter
    # file by the launch; do not duplicate them here.
    backend: sgbm
    # Independent choices: stereo matching backend and map fusion method.
    fusion_method: tsdf
    rectification_alpha: 0.0
    left_rect_frame_id: cam0_rect_optical_frame
    right_rect_frame_id: cam1_rect_optical_frame
    min_depth: 0.3
    max_depth: 10.0
    pixel_stride: 2
    opencv_threads: 2
    stereo_sync_queue_size: 20
    max_pending_frames: 4
    pose_cache_size: 400
    pose_tolerance_sec: 0.0
    pose_wait_sec: 0.3
    voxel_size: 0.05
    max_voxels: 500000
    keyframe_translation: 0.1
    keyframe_rotation_deg: 5.0
    map_publish_period_sec: 0.5
    save_map_path: /tmp/stereo_map.pcd
    save_trajectory_path: /tmp/stereo_ba.tum
    ba:
      enabled: true
      map_frame_id: stereo_map
      max_pending_keyframes: 2
      window_size: 10
      submap_keyframes: 20
      overlap_keyframes: 4
      optimize_every_n_keyframes: 1
      max_trajectory_poses: 20000
      # Optional raw keyframe recording. Each run creates its own session folder.
      archive_directory: ""
      sample_stride: 4
      max_samples_per_frame: 5000
      max_samples_per_cluster: 64
      min_points_per_plane: 24
      min_frames_per_plane: 3
      min_planes: 12
      max_planes: 200
      root_voxel_size: 0.8
      max_voxel_depth: 2
      plane_eigenvalue_ratio: 0.1
      max_plane_rms: 0.05
      min_plane_spread: 0.02
      min_normal_eigenvalue: 0.01
      disparity_sigma: 0.5
      depth_edge_absolute: 0.05
      depth_edge_relative: 0.02
      noise_floor: 0.005
      huber_delta: 2.5
      vio_translation_sigma: 0.15
      vio_rotation_sigma_deg: 5.0
      max_translation_update: 0.2
      max_rotation_update_deg: 5.0
      max_vio_translation: 1.0
      max_vio_rotation_deg: 15.0
      max_iterations: 15
      max_solver_time_sec: 0.15
      num_threads: 1
    tsdf:
      truncation_distance: 0.15
      max_weight: 100.0
      min_weight: 1.0
      integration_stride: 2
    igev:
      engine_path: ""
      left_input_name: left
      right_input_name: right
      output_name: disparity
      # 0 reads static dimensions from the engine. The supplied ONNX uses
      # [1,3,480,768], even though its filename contains 480_752.
      input_width: 0
      input_height: 0
      padding_multiple: 32
      padding_mode: right_bottom
      device_id: 0
    s2m2:
      engine_path: ""
      left_input_name: input_left
      right_input_name: input_right
      output_name: output_disp
      visibility_output_name: output_occ
      confidence_output_name: output_conf
      # Auto-read H/W from the engine; EuRoC needs [1,3,480,768], not [1,3,768,480].
      input_width: 0
      input_height: 0
      device_id: 0
      min_confidence: 0.1
      min_visibility: 0.5
    sgbm:
      min_disparity: 0
      num_disparities: 128
      block_size: 5
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      disp12_max_diff: 1
      pre_filter_cap: 31
